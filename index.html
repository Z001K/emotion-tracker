<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emotion Tracker</title>
    <link href= 'styles.css' rel='stylesheet'/>
</head>
<body>

    <header>
        <h1>Feelings</h1>
        <div class="controls">
            <input type="text" id="emotionInput" placeholder="How do you feel?" max="20">
            <input type="color" id="colorInput" value="#4ea8de">
            <button id="addOrbBtn">Release Orb</button>
            <button id="clearBtn" class="clear-btn">Clear All</button>
        </div>
    </header>

    <canvas id="canvas"></canvas>
    <script src="script.js"></script>

</body>
</html>
